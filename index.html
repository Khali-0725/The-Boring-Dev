<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Boring Dev — by Khali</title>
  <meta name="description" content="The Boring Dev: a no-nonsense coding assistant. No hype, just help. By Khali." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    /* set theme before paint to avoid a flash */
    (function () {
      try {
        var saved = localStorage.getItem("bd-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- Chat history sidebar (device-stored, no login) -->
  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="sidebar-head">
      <span class="sidebar-title">chats</span>
      <button class="new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New chat
      </button>
    </div>
    <p class="recents-label">Recents</p>
    <nav class="recents" id="recents" aria-label="Recent chats"></nav>
    <div class="sidebar-foot">
      <button class="clear-data" id="clear-data" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Clear all data
      </button>
      <p class="sidebar-note">Saved on this device only · no login</p>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <header class="nav">
    <div class="nav-left">
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Toggle chat history" aria-expanded="false" title="Chat history">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <a class="wordmark" href="#" aria-label="The Boring Dev home"><img class="brand-mark" src="assets/logo-mark.png" alt="" width="34" height="34" />the boring dev<span class="dot">.</span></a>
    </div>
    <div class="nav-right">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false" title="Toggle dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
      <span class="version">by khali · v0.1</span>
    </div>
  </header>

  <main class="stage">
    <!-- HERO: the composer is the hero -->
    <section class="hero" id="hero">
      <p class="eyebrow">A coding assistant · by Khali</p>
      <h1 class="headline">What are we<br /><em>building</em>?</h1>
      <p class="subtitle">No hype, no noise — just help. Type below and let's get to work.</p>

      <form class="composer" id="composer" autocomplete="off">
        <div class="attach-preview" id="preview-hero" hidden></div>
        <input type="file" id="file-hero" class="file-input" accept="image/*" hidden />
        <button type="button" class="attach" data-target="file-hero" aria-label="Attach image" title="Attach image">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <button type="button" class="mic" data-target="prompt" aria-label="Speak your message" title="Voice input">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        <textarea
          id="prompt"
          class="composer-input"
          rows="1"
          placeholder="Ask the Boring Dev anything…"
          aria-label="Message the Boring Dev"></textarea>
        <button type="submit" class="send" id="send" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>
        </button>
      </form>

      <ul class="chips" id="chips" aria-label="Example prompts">
        <li><button class="chip" type="button">Explain this error message</button></li>
        <li><button class="chip" type="button">Refactor a messy function</button></li>
        <li><button class="chip" type="button">Write a quick unit test</button></li>
      </ul>
    </section>

    <!-- CHAT: revealed after first send -->
    <section class="chat" id="chat" hidden>
      <div class="thread" id="thread" aria-live="polite"></div>
    </section>
  </main>

  <!-- Docked composer for chat mode -->
  <form class="dock" id="dock" hidden autocomplete="off">
    <div class="attach-preview" id="preview-dock" hidden></div>
    <input type="file" id="file-dock" class="file-input" accept="image/*" hidden />
    <button type="button" class="attach" data-target="file-dock" aria-label="Attach image" title="Attach image">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
    </button>
    <button type="button" class="mic" data-target="dock-input" aria-label="Speak your message" title="Voice input">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>
    <textarea id="dock-input" class="composer-input" rows="1" placeholder="Reply to the Boring Dev…" aria-label="Message the Boring Dev"></textarea>
    <button type="submit" class="send" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>
    </button>
  </form>

  <footer class="foot">
    <span>The Boring Dev · powered by Mistral</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
