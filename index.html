<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Boring Dev — by Khali</title>
  <meta name="description" content="The Boring Dev: a no-nonsense coding assistant. No hype, just help. By Khali." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    /* set theme before paint to avoid a flash */
    (function () {
      try {
        var saved = localStorage.getItem("bd-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav">
    <a class="wordmark" href="#" aria-label="The Boring Dev home">the boring dev<span class="dot">.</span></a>
    <div class="nav-right">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false" title="Toggle dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
      <span class="version">by khali · v0.1</span>
    </div>
  </header>

  <main class="stage">
    <!-- HERO: the composer is the hero -->
    <section class="hero" id="hero">
      <p class="eyebrow">A coding assistant · by Khali</p>
      <h1 class="headline">What are we<br /><em>building</em>?</h1>
      <p class="subtitle">No hype, no noise — just help. Type below and let's get to work.</p>

      <form class="composer" id="composer" autocomplete="off">
        <textarea
          id="prompt"
          class="composer-input"
          rows="1"
          placeholder="Ask the Boring Dev anything…"
          aria-label="Message the Boring Dev"></textarea>
        <button type="submit" class="send" id="send" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>
        </button>
      </form>

      <ul class="chips" id="chips" aria-label="Example prompts">
        <li><button class="chip" type="button">Explain this error message</button></li>
        <li><button class="chip" type="button">Refactor a messy function</button></li>
        <li><button class="chip" type="button">Write a quick unit test</button></li>
      </ul>
    </section>

    <!-- CHAT: revealed after first send -->
    <section class="chat" id="chat" hidden>
      <div class="thread" id="thread" aria-live="polite"></div>
    </section>
  </main>

  <!-- Docked composer for chat mode -->
  <form class="dock" id="dock" hidden autocomplete="off">
    <textarea id="dock-input" class="composer-input" rows="1" placeholder="Reply to the Boring Dev…" aria-label="Message the Boring Dev"></textarea>
    <button type="submit" class="send" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>
    </button>
  </form>

  <footer class="foot">
    <span>The Boring Dev · powered by Mistral</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
